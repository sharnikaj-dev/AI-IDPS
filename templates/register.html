<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | AI-IDPS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">AI</div>
      <h1>Create AI-IDPS Account</h1>
      <p>Register to access the cyber threat detection &amp; prevention console.</p>
    </div>

    {% if error %}
      <div class="alert-banner alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" class="form-stack">
      <div class="form-group">
        <label for="username">Full Name</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="e.g. Sharnika J"
          value="{{ form_data.get('username', '') }}"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="analyst@network.local"
          value="{{ form_data.get('email', '') }}"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Minimum 6 characters"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Re-enter password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</body>
</html>
