<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AI-IDPS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">AI</div>
      <h1>AI-IDPS Console Login</h1>
      <p>Sign in with your registered email and password.</p>
    </div>

    {% if error %}
      <div class="alert-banner alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="alert-banner alert-success">{{ success }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="form-stack">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="analyst@network.local"
          value="{{ email or '' }}"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="auth-footer">
      New analyst? <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </div>
</body>
</html>
